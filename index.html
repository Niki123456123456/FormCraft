<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#181c23" />
  <meta name="description" content="FormCraft — a private, browser-based 3D workspace. Import GLB models, explore their hierarchy, and inspect every angle." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23181c23%27/%3E%3Cpath d=%27M18 46V18h28v7H26v6h16v7H26v8z%27 fill=%27%23a7d9bd%27/%3E%3C/svg%3E" />
  <title>FormCraft · 3D workspace</title>
  <link data-trunk rel="rust" data-wasm-opt="s" />
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#181c23; color:#e1e5ed; font-family:system-ui,sans-serif; }
    canvas { width:100%; height:100%; display:block; outline:none; touch-action:none; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; text-align:center; pointer-events:none; background:#181c23; z-index:10; }
    #loading strong { font-size:30px; letter-spacing:-1px; }
    #loading strong span { color:#a7d9bd; }
    #loading p { color:#969fab; font-size:14px; }
    #loading.error { pointer-events:auto; padding:32px; }
  </style>
</head>
<body>
  <canvas id="formcraft" tabindex="0" aria-label="FormCraft 3D modeling workspace"></canvas>
  <div id="loading" role="status"><strong>Form<span>Craft</span></strong><p id="loading-detail">Preparing your 3D workspace…</p></div>
  <script>
    const overlay = document.getElementById('loading');
    const showStartupError = () => {
      if (!overlay.isConnected) return;
      overlay.classList.add('error');
      document.getElementById('loading-detail').textContent = 'The workspace could not start. Try a current browser with WebGL 2 enabled, then reload. See the browser console for details.';
    };
    window.addEventListener('error', showStartupError);
    window.addEventListener('unhandledrejection', showStartupError);
    // Keep the loading screen until the engine has actually rendered a frame.
    window.formcraftReady = () => overlay.remove();
    window.addEventListener('TrunkApplicationStarted', () => {
      const waitForFrame = () => {
        if (document.querySelector('canvas').dataset.ready) overlay.remove();
        else requestAnimationFrame(waitForFrame);
      };
      requestAnimationFrame(waitForFrame);
    });
    window.addEventListener('TrunkApplicationError', showStartupError);
    document.getElementById('formcraft').addEventListener('contextmenu', event => event.preventDefault());
  </script>
  <noscript>FormCraft needs JavaScript and WebGL 2 to render the 3D workspace.</noscript>
</body>
</html>
