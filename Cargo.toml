[package]
name = "formcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "A browser-based 3D workspace built with Bevy and egui"

[features]
default = ["app"]
app = ["dep:bevy", "dep:bevy_egui", "dep:rfd", "dep:wasm-bindgen-futures", "dep:web-sys"]

[[bin]]
name = "formcraft"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
bevy = { optional = true, version = "=0.20.0", default-features = false, features = [
  "default_app", "std", "bevy_winit", "3d_bevy_render", "scene",
  "pan_orbit_camera", "mouse", "keyboard", "touch", "picking",
  "webgl2", "png", "jpeg", "x11"
] }
bevy_egui = { optional = true, version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
rfd = { version = "0.15.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { optional = true, version = "0.3", features = ["Window", "Document", "Element"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
